name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Engineering Metrics Infographics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: kelly26ici
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Nairobi
          config_order: base.header, isocalendar, languages
          
          # Isometric 3D commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Detailed language analytics
          plugin_languages: yes
          plugin_languages_analysis_limit: 200
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          
          # Lines of code
          plugin_lines: yes
          
          # Output configuration
          filename: github-metrics.svg
          committer_message: "chore: update engineering profile metrics [skip ci]"
